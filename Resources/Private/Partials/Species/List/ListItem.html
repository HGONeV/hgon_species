<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">


    <f:if condition="{speciesRecordType} == 'dragonfly'">
        <tr data-species-search-id="{species.uid}">
            <td>
                <f:link.action action="show" controller="Species" pluginName="show" pageUid="{settings.showPid}" arguments="{species : species}">
                    {species.nameScience}
                </f:link.action>
            </td>

            <td>
                {species.name}
            </td>

            <td>
                {species.family.parent.title}
            </td>

            <td>
                <f:if condition="{species.mtb64}">
                    <f:then>
                        {species.mtb64}
                    </f:then>
                    <f:else>
                        -
                    </f:else>
                </f:if>
            </td>

            <td>
                <f:if condition="{species.proof}">
                    <f:then>
                        {species.proof}
                    </f:then>
                    <f:else>
                        -
                    </f:else>
                </f:if>
            </td>

            <td>
                <f:if condition="{species.remark}">
                    <f:then>
                        <f:format.stripTags>{species.remark}</f:format.stripTags>
                    </f:then>
                    <f:else>
                        -
                    </f:else>
                </f:if>
            </td>

        </tr>
    </f:if>


    <f:if condition="{speciesRecordType} == 'bird'">
        <tr data-species-search-id="{species.uid}">
            <td>
                <f:link.action action="show" controller="Species" pluginName="show" pageUid="{settings.showPid}" arguments="{species : species}">
                    {species.name}
                </f:link.action>
                <f:if condition="{species.nameScience}">
                    <small class="species-search__scientific-name" data-species-search-scientific hidden>{species.nameScience}</small>
                </f:if>
            </td>
            <td>
                <f:if condition="{species.remark}">
                    <f:then>
                        <f:format.raw>{species.remark}</f:format.raw>
                    </f:then>
                    <f:else>
                        -
                    </f:else>
                </f:if>
            </td>
        </tr>
    </f:if>


    <f:if condition="{speciesRecordType} == 'default'">
        <tr>
            <td>
                <f:link.action action="show" controller="Species" pluginName="show" pageUid="{settings.showPid}" arguments="{species : species}">
                    {species.name}
                </f:link.action>
            </td>
            <td>
                <f:if condition="{species.remark}">
                    <f:then>
                        <f:format.raw>{species.remark}</f:format.raw>
                    </f:then>
                    <f:else>
                        -
                    </f:else>
                </f:if>
            </td>
        </tr>
    </f:if>
</html>
