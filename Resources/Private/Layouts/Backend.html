<!DOCTYPE html>
<html
    lang="de"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arten-Daten pflegen</title>
    <link rel="stylesheet" href="{f:uri.resource(path: 'EXT:backend/Resources/Public/Css/backend.css')}" />
    <link rel="stylesheet" href="{f:uri.resource(path: 'EXT:backend/Resources/Public/Css/webfonts.css')}" />

    <style>
        .species-tabs > .species-tabs__toggle {
            position: absolute;
            inline-size: 1px;
            block-size: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .species-tabs .nav-link {
            cursor: pointer;
        }

        .species-tabs .tab-content {
            border: 1px solid var(--bs-border-color);
            border-top: 0;
            color: var(--typo3-text-color-base);
            background: var(--typo3-surface-container-low);
        }

        .species-tabs .tab-pane {
            display: none;
            padding: 1.5rem;
        }

        #species-export-toggle:checked ~ .nav-tabs label[for="species-export-toggle"],
        #species-import-toggle:checked ~ .nav-tabs label[for="species-import-toggle"] {
            color: var(--bs-nav-tabs-link-active-color);
            background-color: var(--bs-nav-tabs-link-active-bg);
            border-color: var(--bs-nav-tabs-link-active-border-color);
        }

        #species-export-toggle:checked ~ .tab-content #species-export,
        #species-import-toggle:checked ~ .tab-content #species-import {
            display: block;
        }

        .species-maintenance__form {
            max-width: 640px;
        }
    </style>
</head>
<body class="t3js-body">
    <main class="module-body">
        <div class="container-small">
            <f:render partial="FlashMessages" arguments="{_all}" />
            <f:render section="content" />
        </div>
    </main>
</body>
</html>
